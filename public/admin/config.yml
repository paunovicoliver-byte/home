# Decap CMS — https://decapcms.org/docs/
# Every text field exists once per language (EN / DE-CH / SR). A language block
# can be left empty to keep that version unpublished.
backend:
  name: github
  repo: paunovicoliver-byte/home
  branch: main
# For local editing run `npx decap-server` and uncomment:
# local_backend: true

media_folder: src/assets/images
public_folder: ../../assets/images
publish_mode: editorial_workflow

collections:
  - name: projects
    label: Projects
    folder: src/content/projects
    format: yml
    extension: yml
    create: true
    slug: "{{fields.id}}"
    identifier_field: id
    summary: "{{i18n.en.title}}"
    fields:
      - { name: id, label: 'Internal id (file name)', widget: string }
      - { name: order, label: Order, widget: number, default: 100 }
      - { name: featured, label: Show on homepage, widget: boolean, default: false }
      - { name: filters, label: Filters, widget: select, multiple: true, options: [windows, heritage, houses, public, tables, doors, custom] }
      - { name: year, label: Year (optional), widget: number, required: false, value_type: int }
      - name: cover
        label: Hero image
        widget: object
        required: true
        fields:
          - { name: src, label: Image, widget: image }
          - name: alt
            label: Alt text
            widget: object
            fields:
          - { name: en, label: 'Alt text — English', widget: string }
          - { name: de, label: 'Alt text — Deutsch (Schweiz)', widget: string }
          - { name: sr, label: 'Alt text — Srpski (latinica)', widget: string }
      - name: gallery
        label: Gallery
        widget: list
        required: false
        fields:
          - { name: src, label: Image, widget: image }
          - name: alt
            label: Alt text
            widget: object
            fields:
              - { name: en, label: 'Alt text — English', widget: string }
              - { name: de, label: 'Alt text — Deutsch (Schweiz)', widget: string }
              - { name: sr, label: 'Alt text — Srpski (latinica)', widget: string }
      - name: beforeAfter
        label: Before / after (optional)
        widget: object
        required: false
        fields:
          - name: before
            label: Before
            widget: object
            required: true
            fields:
              - { name: src, label: Image, widget: image }
              - name: alt
                label: Alt text
                widget: object
                fields:
              - { name: en, label: 'Alt text — English', widget: string }
              - { name: de, label: 'Alt text — Deutsch (Schweiz)', widget: string }
              - { name: sr, label: 'Alt text — Srpski (latinica)', widget: string }
          - name: after
            label: After
            widget: object
            required: true
            fields:
              - { name: src, label: Image, widget: image }
              - name: alt
                label: Alt text
                widget: object
                fields:
              - { name: en, label: 'Alt text — English', widget: string }
              - { name: de, label: 'Alt text — Deutsch (Schweiz)', widget: string }
              - { name: sr, label: 'Alt text — Srpski (latinica)', widget: string }
      - name: i18n
        label: Texts per language
        widget: object
        fields:
          - name: en
            label: 'English'
            widget: object
            collapsed: true
            fields:
              - { name: slug, label: 'URL slug (lowercase, hyphens, no diacritics)', widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'lowercase letters, numbers, hyphens'] }
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: location, label: Location (optional), widget: string, required: false }
              - { name: type, label: Project type, widget: string }
              - { name: story, label: Story paragraphs, widget: list, field: { name: p, label: Paragraph, widget: text } }
              - { name: challenge, label: Challenge paragraphs, widget: list, required: false, field: { name: p, label: Paragraph, widget: text } }
              - { name: approach, label: Approach paragraphs, widget: list, required: false, field: { name: p, label: Paragraph, widget: text } }
              - { name: materials, label: Materials, widget: list, required: false, field: { name: m, label: Material, widget: string } }
              - { name: quote, label: Client quote (optional — real quotes only), widget: object, required: false, fields: [ { name: text, label: Quote, widget: text }, { name: author, label: Author, widget: string } ] }
              - { name: seoDescription, label: SEO description, widget: text }
          - name: de
            label: 'Deutsch (Schweiz)'
            widget: object
            collapsed: true
            fields:
              - { name: slug, label: 'URL slug (lowercase, hyphens, no diacritics)', widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'lowercase letters, numbers, hyphens'] }
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: location, label: Location (optional), widget: string, required: false }
              - { name: type, label: Project type, widget: string }
              - { name: story, label: Story paragraphs, widget: list, field: { name: p, label: Paragraph, widget: text } }
              - { name: challenge, label: Challenge paragraphs, widget: list, required: false, field: { name: p, label: Paragraph, widget: text } }
              - { name: approach, label: Approach paragraphs, widget: list, required: false, field: { name: p, label: Paragraph, widget: text } }
              - { name: materials, label: Materials, widget: list, required: false, field: { name: m, label: Material, widget: string } }
              - { name: quote, label: Client quote (optional — real quotes only), widget: object, required: false, fields: [ { name: text, label: Quote, widget: text }, { name: author, label: Author, widget: string } ] }
              - { name: seoDescription, label: SEO description, widget: text }
          - name: sr
            label: 'Srpski (latinica)'
            widget: object
            collapsed: true
            fields:
              - { name: slug, label: 'URL slug (lowercase, hyphens, no diacritics)', widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'lowercase letters, numbers, hyphens'] }
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: location, label: Location (optional), widget: string, required: false }
              - { name: type, label: Project type, widget: string }
              - { name: story, label: Story paragraphs, widget: list, field: { name: p, label: Paragraph, widget: text } }
              - { name: challenge, label: Challenge paragraphs, widget: list, required: false, field: { name: p, label: Paragraph, widget: text } }
              - { name: approach, label: Approach paragraphs, widget: list, required: false, field: { name: p, label: Paragraph, widget: text } }
              - { name: materials, label: Materials, widget: list, required: false, field: { name: m, label: Material, widget: string } }
              - { name: quote, label: Client quote (optional — real quotes only), widget: object, required: false, fields: [ { name: text, label: Quote, widget: text }, { name: author, label: Author, widget: string } ] }
              - { name: seoDescription, label: SEO description, widget: text }

