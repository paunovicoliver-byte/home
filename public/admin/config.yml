              - { name: specs, label: Specifications, widget: list, required: false, fields: [ { name: label, label: Label, widget: string }, { name: value, label: Value, widget: string } ] }
              - { name: care, label: Care instructions, widget: list, required: false, field: { name: c, label: Instruction, widget: string } }
              - { name: seoTitle, label: SEO title (optional), widget: string, required: false }
              - { name: seoDescription, label: SEO description, widget: text }
