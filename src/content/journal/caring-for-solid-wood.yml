  en:
    slug: caring-for-solid-wood
    title: Caring for solid wood
    excerpt: Solid wood asks for little, but it asks regularly. A few simple habits keep a table, a door or a window beautiful for decades.
    seoDescription: Simple, practical care for solid wood tables, doors and windows — cleaning, oiling and why marks are part of a piece's life.
    body: |
      Solid wood asks for little, but it asks regularly. A few simple habits keep a table, a door or a window beautiful for decades.

      ## Everyday

      Wipe with a soft, slightly damp cloth and dry afterwards. Avoid strong cleaning agents, standing water and hot pans placed directly on the surface.

      ## Once or twice a year

      Oiled surfaces are refreshed with a thin coat of the same oil, rubbed in and wiped off. You will see when it is time: the surface looks dry, and water no longer beads on it.

      ## Marks and scratches

      Marks are part of a piece's life. Many can be sanded out locally and re-oiled — that is one of the quiet advantages of solid wood. If you are unsure, send us a photograph and we will advise you.

      ## Windows and doors

      On the weather side, check the finish every spring, paying attention to bottom rails and sills. Small touch-ups in time save larger repairs later.
  de:
    slug: pflege-von-massivholz
    title: Die Pflege von Massivholz
    excerpt: Massivholz verlangt wenig, aber regelmässig. Ein paar einfache Gewohnheiten halten einen Tisch, eine Tür oder ein Fenster über Jahrzehnte schön.
    seoDescription: Einfache, praktische Pflege für Tische, Türen und Fenster aus Massivholz — Reinigung, Ölen und warum Spuren zum Leben eines Stücks gehören.
    body: |
      Massivholz verlangt wenig, aber regelmässig. Ein paar einfache Gewohnheiten halten einen Tisch, eine Tür oder ein Fenster über Jahrzehnte schön.

      ## Im Alltag

      Mit einem weichen, leicht feuchten Tuch abwischen und danach trocknen. Scharfe Reinigungsmittel, stehendes Wasser und heisse Pfannen direkt auf der Oberfläche vermeiden.

      ## Ein- bis zweimal im Jahr

      Geölte Oberflächen werden mit einer dünnen Schicht desselben Öls aufgefrischt, eingerieben und abgenommen. Sie sehen, wann es so weit ist: Die Oberfläche wirkt trocken, und Wasser perlt nicht mehr ab.

      ## Spuren und Kratzer

      Spuren gehören zum Leben eines Stücks. Viele lassen sich örtlich ausschleifen und nachölen — einer der stillen Vorteile von Massivholz. Wenn Sie unsicher sind, schicken Sie uns ein Foto, und wir beraten Sie.

      ## Fenster und Türen

      Auf der Wetterseite die Oberfläche jeden Frühling prüfen, besonders untere Rahmenhölzer und Fensterbänke. Kleine Ausbesserungen zur rechten Zeit ersparen später grössere Reparaturen.
  sr:
    slug: nega-masivnog-drveta
    title: Nega masivnog drveta
    excerpt: Masivno drvo traži malo, ali redovno. Nekoliko jednostavnih navika čuva sto, vrata ili prozor lepim decenijama.
    seoDescription: Jednostavna i praktična nega stolova, vrata i prozora od masivnog drveta — čišćenje, nauljivanje i zašto su tragovi deo života jednog komada.
    body: |
      Masivno drvo traži malo, ali redovno. Nekoliko jednostavnih navika čuva sto, vrata ili prozor lepim decenijama.

      ## Svakodnevno

      Brišite mekom, blago vlažnom krpom i zatim osušite. Izbegavajte jaka sredstva za čišćenje, vodu koja stoji i vruće posuđe direktno na površini.

      ## Jednom ili dva puta godišnje

      Nauljene površine osvežavaju se tankim slojem istog ulja, koje se utrlja i obriše. Videćete kada je vreme: površina deluje suvo, a voda se više ne zadržava u kapima.

      ## Tragovi i ogrebotine

      Tragovi su deo života jednog komada. Mnogi mogu lokalno da se izbruse i ponovo nauljuju — to je jedna od tihih prednosti masivnog drveta. Ako niste sigurni, pošaljite nam fotografiju i posavetovaćemo vas.

      ## Prozori i vrata

      Na strani izloženoj vremenu, svakog proleća proverite površinu, naročito donje delove okvira i klupice. Male popravke na vreme štede velike kasnije.
