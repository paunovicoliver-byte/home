i18n:
  en:
    slug: what-makes-an-old-window-worth-saving
    title: What makes an old window worth saving?
    excerpt: Peeling paint and a draught do not mean a window has reached its end. Before deciding anything, we look closely.
    seoDescription: How DRVENO decides whether an old wooden window should be repaired, reproduced or replaced — construction, profiles, proportions, material and condition.
    body: |
      Peeling paint, a draught, a sash that sticks in winter. To many people, these are signs that a window must go. Often they are only signs that it needs attention.

      ## We look before we decide

      Before we recommend anything, we try to understand the window in front of us:

      - **Construction** — how it was built and how its parts are joined.
      - **Profiles** — the shapes of its mouldings and bars, which give a façade much of its character.
      - **Proportions** — how the window relates to the wall and to the other openings.
      - **Material** — what wood was used, and how it has aged.
      - **Condition** — where it has suffered, and how deep the damage goes.
      - **Architectural character** — what role the window plays in the building as a whole.

      ## Repair, reproduce or replace

      Only then do we decide. Where the wood is sound, repair keeps the original material and the work of the people who made it. Where parts are beyond saving, we reproduce them. And where a window truly has to be replaced, we try to do it in the same language, so the building keeps its face.

      ## Preserving what deserves to remain

      Not everything old is precious. But a great deal of it is better than it looks at first sight — and much of it deserves to remain.
  de:
    slug: wann-sich-ein-altes-fenster-lohnt
    title: Wann lohnt es sich, ein altes Fenster zu erhalten?
    excerpt: Abblätternde Farbe und ein Luftzug bedeuten noch nicht, dass ein Fenster am Ende ist. Bevor wir etwas entscheiden, schauen wir genau hin.
    seoDescription: Wie DRVENO entscheidet, ob ein altes Holzfenster repariert, nachgebaut oder ersetzt wird — Konstruktion, Profile, Proportionen, Material und Zustand.
    body: |
      Abblätternde Farbe, ein Luftzug, ein Flügel, der im Winter klemmt. Für viele sind das Zeichen, dass ein Fenster weg muss. Oft sind es nur Zeichen, dass es Aufmerksamkeit braucht.

      ## Wir schauen hin, bevor wir entscheiden

      Bevor wir etwas empfehlen, versuchen wir das Fenster zu verstehen, das vor uns steht:

      - **Konstruktion** — wie es gebaut ist und wie seine Teile verbunden sind.
      - **Profile** — die Formen von Kehlungen und Sprossen, die einer Fassade viel von ihrem Charakter geben.
      - **Proportionen** — wie sich das Fenster zur Wand und zu den anderen Öffnungen verhält.
      - **Material** — welches Holz verwendet wurde und wie es gealtert ist.
      - **Zustand** — wo es gelitten hat und wie tief der Schaden geht.
      - **Architektonischer Charakter** — welche Rolle das Fenster im ganzen Gebäude spielt.

      ## Reparieren, nachbauen oder ersetzen

      Erst dann entscheiden wir. Wo das Holz gesund ist, bewahrt die Reparatur das Originalmaterial und die Arbeit der Menschen, die es gebaut haben. Wo Teile nicht mehr zu retten sind, bauen wir sie nach. Und wo ein Fenster wirklich ersetzt werden muss, versuchen wir es in derselben Sprache zu tun, damit das Gebäude sein Gesicht behält.

      ## Erhalten, was es verdient

      Nicht alles Alte ist kostbar. Aber vieles ist besser, als es auf den ersten Blick scheint — und vieles verdient es, zu bleiben.
  sr:
    slug: kada-vredi-sacuvati-stari-prozor
    title: Kada vredi sačuvati stari prozor?
    excerpt: Oljuštena boja i promaja ne znače da je prozor došao do kraja. Pre nego što bilo šta odlučimo, pažljivo gledamo.
    seoDescription: Kako DRVENO odlučuje da li stari drveni prozor treba popraviti, rekonstruisati ili zameniti — konstrukcija, profili, proporcije, materijal i stanje.
    body: |
      Oljuštena boja, promaja, krilo koje zimi zapinje. Mnogima su to znaci da prozor mora da ode. Često su to samo znaci da mu je potrebna pažnja.

      ## Gledamo pre nego što odlučimo

      Pre nego što bilo šta preporučimo, trudimo se da razumemo prozor koji je pred nama:

      - **Konstrukcija** — kako je napravljen i kako su delovi spojeni.
      - **Profili** — oblici letvica i prečki, koji fasadi daju veliki deo njenog karaktera.
      - **Proporcije** — u kakvom je odnosu prozor prema zidu i drugim otvorima.
      - **Materijal** — koje je drvo korišćeno i kako je ostarilo.
      - **Stanje** — gde je stradao i koliko je oštećenje duboko.
      - **Arhitektonski karakter** — kakvu ulogu prozor ima u zgradi kao celini.

      ## Popraviti, rekonstruisati ili zameniti

      Tek tada odlučujemo. Gde je drvo zdravo, popravka čuva originalni materijal i rad ljudi koji su ga napravili. Gde delovi više ne mogu da se spasu, rekonstruišemo ih. A gde prozor zaista mora da se zameni, trudimo se da to uradimo istim jezikom, kako bi zgrada sačuvala svoje lice.

      ## Sačuvati ono što zaslužuje da ostane

      Nije sve staro dragoceno. Ali mnogo toga je bolje nego što izgleda na prvi pogled — i mnogo toga zaslužuje da ostane.
