i18n:
  en:
    slug: why-we-still-build-wooden-windows
    title: Why we still build wooden windows
    excerpt: For most of his working life, our founder has chosen wood over plastic for windows. Not out of nostalgia — out of conviction.
    seoDescription: Why DRVENO still builds windows in solid wood rather than plastic — on repairability, character and windows that are allowed to age.
    body: |
      For most of his working life, our founder has chosen wood over plastic when it comes to windows. People sometimes assume this is nostalgia. It is not. It is a conviction that grew slowly, one window at a time.

      ## A window can be repaired

      A wooden window is made of parts: rails, stiles, bars, glazing beads. When one part suffers — usually the bottom rail on the weather side — it can be repaired or replaced on its own. The rest of the window continues to serve.

      That simple fact changes how you think about a building. A window is no longer a product with an end date. It becomes something you look after.

      ## Wood is honest

      We do not want to cover nature with plastic that imitates what already exists naturally. Wood has a grain, a colour and a weight of its own. It moves a little with the seasons. It ages, and if it is cared for, it ages well.

      ## Every opening is different

      Especially in older buildings, no two openings are quite the same. Building each window by hand allows us to follow the building rather than force it into a standard size.

      ## What we do not claim

      Questions of insulation, glazing and performance are real, and they depend on the building, the climate and the regulations. We discuss them openly for every project, rather than promising numbers on a website.

      What we can promise is care: a window built slowly, for one place, so that it can stay there for a very long time.
  de:
    slug: warum-wir-noch-holzfenster-bauen
    title: Warum wir noch immer Holzfenster bauen
    excerpt: Fast sein ganzes Berufsleben lang hat sich unser Gründer bei Fenstern für Holz statt Kunststoff entschieden. Nicht aus Nostalgie — aus Überzeugung.
    seoDescription: Warum DRVENO Fenster nach wie vor aus Massivholz statt aus Kunststoff baut — über Reparierbarkeit, Charakter und Fenster, die altern dürfen.
    body: |
      Fast sein ganzes Berufsleben lang hat sich unser Gründer bei Fenstern für Holz und gegen Kunststoff entschieden. Manche halten das für Nostalgie. Das ist es nicht. Es ist eine Überzeugung, die langsam gewachsen ist, Fenster für Fenster.

      ## Ein Fenster lässt sich reparieren

      Ein Holzfenster besteht aus Teilen: Rahmenhölzer, Sprossen, Glasleisten. Leidet ein Teil — meist das untere Rahmenholz auf der Wetterseite —, lässt es sich einzeln reparieren oder ersetzen. Der Rest des Fensters dient weiter.

      Diese einfache Tatsache verändert den Blick auf ein Gebäude. Ein Fenster ist dann kein Produkt mit Ablaufdatum mehr, sondern etwas, das man pflegt.

      ## Holz ist ehrlich

      Wir möchten die Natur nicht mit Kunststoff überziehen, der nachahmt, was es natürlich schon gibt. Holz hat eine eigene Maserung, eine eigene Farbe, ein eigenes Gewicht. Es bewegt sich ein wenig mit den Jahreszeiten. Es altert — und wenn man es pflegt, altert es gut.

      ## Jede Öffnung ist anders

      Gerade in älteren Gebäuden gleicht keine Öffnung genau der anderen. Wenn wir jedes Fenster von Hand bauen, können wir dem Gebäude folgen, statt es in ein Standardmass zu zwingen.

      ## Was wir nicht versprechen

      Fragen zu Dämmung, Verglasung und Leistung sind berechtigt, und sie hängen vom Gebäude, vom Klima und von den Vorschriften ab. Wir besprechen sie bei jedem Projekt offen, statt auf einer Website Zahlen zu versprechen.

      Versprechen können wir Sorgfalt: ein Fenster, langsam gebaut, für einen bestimmten Ort, damit es dort sehr lange bleiben kann.
  sr:
    slug: zasto-i-dalje-pravimo-drvene-prozore
    title: Zašto i dalje pravimo drvene prozore
    excerpt: Gotovo ceo radni vek naš osnivač je za prozore birao drvo umesto plastike. Ne iz nostalgije — iz uverenja.
    seoDescription: Zašto DRVENO i dalje pravi prozore od masivnog drveta umesto od plastike — o popravljivosti, karakteru i prozorima kojima je dozvoljeno da stare.
    body: |
      Gotovo ceo radni vek naš osnivač je za prozore birao drvo umesto plastike. Ljudi ponekad misle da je to nostalgija. Nije. To je uverenje koje je raslo polako, prozor po prozor.

      ## Prozor može da se popravi

      Drveni prozor sastoji se od delova: okvira, krila, prečki, letvica za staklo. Kada jedan deo strada — najčešće donji deo okvira na strani izloženoj vremenu — on može da se popravi ili zameni zasebno. Ostatak prozora nastavlja da služi.

      Ta jednostavna činjenica menja način na koji gledamo na zgradu. Prozor više nije proizvod sa rokom trajanja, već nešto o čemu se brinemo.

      ## Drvo je iskreno

      Ne želimo da prirodu prekrivamo plastikom koja oponaša ono što već prirodno postoji. Drvo ima svoju šaru, svoju boju i svoju težinu. Pomalo se pomera sa godišnjim dobima. Stari — a ako se o njemu brine, stari lepo.

      ## Svaki otvor je drugačiji

      Naročito u starijim zgradama, nijedan otvor nije sasvim isti kao drugi. Kada svaki prozor pravimo ručno, možemo da pratimo zgradu, umesto da je teramo u standardnu meru.

      ## Šta ne obećavamo

      Pitanja izolacije, zastakljivanja i performansi su opravdana i zavise od objekta, klime i propisa. O njima otvoreno razgovaramo za svaki projekat, umesto da na sajtu obećavamo brojke.

      Ono što možemo da obećamo jeste pažnja: prozor napravljen polako, za jedno mesto, kako bi tamo mogao da ostane veoma dugo.
