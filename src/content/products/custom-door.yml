i18n:
  en:
    slug: custom-wooden-door
    name: Custom Door
    summary: Entrance doors and interior doors in solid wood — panelled, plain or reproduced from an original, always made for one opening.
    story:
      - A door is touched more often than almost anything else in a house. It should close with weight and quiet, and it should age with dignity.
      - We build panelled, ledged or plain doors, and we reproduce historic doors where the original can no longer be repaired.
    wood: Oak, walnut or larch.
    dimensions: Made to measure for each opening.
    finish: Oil, wax or paint, agreed per project.
    specs:
      - label: Types
        value: Entrance, interior, panelled, plain, reproduction
      - label: Hardware
        value: Selected per project
    care:
      - Clean with a damp cloth.
      - Exterior doors - inspect and refresh the weather-side finish every year.
    seoDescription: Custom solid wood doors — entrance, interior and historic reproductions — handmade in Serbia for homes in Switzerland and across Europe.
  de:
    slug: holztuer-nach-mass
    name: Tür nach Mass
    summary: Haus- und Innentüren aus Massivholz — mit Kassetten, schlicht oder nach Original nachgebaut, immer für eine bestimmte Öffnung.
    story:
      - Eine Tür wird öfter berührt als fast alles andere im Haus. Sie soll satt und leise schliessen und in Würde altern.
      - Wir bauen Kassettentüren, Brettertüren und schlichte Türen, und wir bauen historische Türen nach, wenn das Original nicht mehr zu reparieren ist.
    wood: Eiche, Nussbaum oder Lärche.
    dimensions: Für jede Öffnung nach Mass.
    finish: Öl, Wachs oder Farbe, je nach Projekt.
    specs:
      - label: Arten
        value: Haustür, Innentür, Kassettentür, schlichte Tür, Nachbau
      - label: Beschläge
        value: Je nach Projekt ausgewählt
    care:
      - Mit einem feuchten Tuch reinigen.
      - Haustüren - die Oberfläche auf der Wetterseite jährlich prüfen und auffrischen.
    seoDescription: Türen aus Massivholz nach Mass — Haustüren, Innentüren und Nachbauten historischer Türen —, von Hand gefertigt in Serbien für die Schweiz und Europa.
  sr:
    slug: drvena-vrata-po-meri
    name: Vrata po meri
    summary: Ulazna i sobna vrata od masivnog drveta — sa kasetama, jednostavna ili izrađena po originalu, uvek za jedan određeni otvor.
    story:
      - Vrata dodirujemo češće od gotovo bilo čega drugog u kući. Treba da se zatvaraju puno i tiho, i da stare dostojanstveno.
      - Pravimo vrata sa kasetama, vrata od dasaka i jednostavna vrata, a istorijska vrata rekonstruišemo kada original više ne može da se popravi.
    wood: Hrast, orah ili ariš.
    dimensions: Po meri za svaki otvor.
    finish: Ulje, vosak ili boja, prema dogovoru.
    specs:
      - label: Vrste
        value: Ulazna, sobna, sa kasetama, jednostavna, rekonstrukcija
      - label: Okov
        value: Bira se prema projektu
    care:
      - Čistite vlažnom krpom.
      - Ulazna vrata - svake godine proverite i osvežite površinu na strani izloženoj vremenu.
    seoDescription: Vrata od masivnog drveta po meri — ulazna, sobna i rekonstrukcije istorijskih vrata — ručno izrađena u Srbiji za domove u Švajcarskoj i Evropi.
