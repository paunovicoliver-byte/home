i18n:
  en:
    slug: farmhouse-table
    name: Farmhouse Table
    summary: A generous table with a trestle base, in the tradition of rural kitchens — honest, heavy and built to be used every day.
    story:
      - The farmhouse table is one of the oldest forms in furniture making, and for good reason. A thick top, a sturdy trestle and a stretcher low enough for tired feet.
      - We make it in oak, walnut or ash, with boards that keep their character — knots and colour changes included.
    wood: Oak, walnut or ash.
    dimensions: Example 240 × 100 × 76 cm — made to your room.
    finish: Hard-wax oil or natural soap finish.
    specs:
      - label: Top
        value: Thick solid boards
      - label: Base
        value: Trestle with stretcher, solid wood
    care:
      - Everyday cleaning with a damp cloth.
      - Re-oil as needed; soap-finished tops are refreshed with a soap solution.
    seoDescription: A handmade farmhouse table in solid oak, walnut or ash with a trestle base. Made to measure in Serbia, delivered across Europe.
  de:
    slug: bauerntisch
    name: Bauerntisch
    summary: Ein grosszügiger Tisch mit Wangengestell, in der Tradition ländlicher Küchen — ehrlich, schwer und für den täglichen Gebrauch gebaut.
    story:
      - Der Bauerntisch gehört zu den ältesten Formen des Möbelbaus, und das aus gutem Grund. Eine dicke Platte, ein stabiles Gestell und eine Fussstrebe, tief genug für müde Füsse.
      - Wir fertigen ihn in Eiche, Nussbaum oder Esche, mit Brettern, die ihren Charakter behalten — Äste und Farbwechsel inbegriffen.
    wood: Eiche, Nussbaum oder Esche.
    dimensions: Beispiel 240 × 100 × 76 cm — nach Ihrem Raum.
    finish: Hartwachsöl oder Seifenoberfläche.
    specs:
      - label: Platte
        value: Dicke Massivholzbretter
      - label: Gestell
        value: Wangengestell mit Fussstrebe, Massivholz
    care:
      - Im Alltag mit einem feuchten Tuch reinigen.
      - Bei Bedarf nachölen; geseifte Platten werden mit Seifenlauge aufgefrischt.
    seoDescription: Handgefertigter Bauerntisch aus massiver Eiche, Nussbaum oder Esche mit Wangengestell. Nach Mass gefertigt in Serbien, geliefert in ganz Europa.
  sr:
    slug: seoski-sto
    name: Seoski sto
    summary: Prostran sto na nogarima, u tradiciji seoskih kuhinja — iskren, težak i napravljen za svakodnevnu upotrebu.
    story:
      - Seoski sto je jedan od najstarijih oblika u izradi nameštaja, i to s razlogom. Debela ploča, čvrsti nogari i prečka dovoljno nisko za umorne noge.
      - Pravimo ga od hrasta, oraha ili jasena, od dasaka koje zadržavaju svoj karakter — sa čvorovima i promenama boje.
    wood: Hrast, orah ili jasen.
    dimensions: Primer 240 × 100 × 76 cm — po meri vašeg prostora.
    finish: Tvrdo uljani vosak ili završna obrada sapunom.
    specs:
      - label: Ploča
        value: Debele daske od masivnog drveta
      - label: Postolje
        value: Nogari sa prečkom, masivno drvo
    care:
      - Svakodnevno čišćenje vlažnom krpom.
      - Po potrebi nauljite; ploče obrađene sapunom osvežavaju se rastvorom sapuna.
    seoDescription: Ručno izrađen seoski sto od masivnog hrasta, oraha ili jasena, na nogarima. Izrada po meri u Srbiji, isporuka širom Evrope.
