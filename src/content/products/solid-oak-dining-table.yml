i18n:
  en:
    slug: solid-oak-dining-table
    name: Solid Oak Dining Table
    summary: A table for long evenings and ordinary mornings — solid oak boards, chosen and joined by hand, made to gather marks and stories.
    story:
      - We choose the boards for each table together, as a set. Grain, colour and knots are arranged so the top reads as one surface, while every board keeps its own character.
      - Solid oak can be sanded and re-oiled again and again. A table like this is not meant to stay new; it is meant to grow with a household.
    wood: Solid European oak.
    dimensions: Example 220 × 95 × 75 cm — length, width and height made to your room.
    finish: Hard-wax oil, natural or lightly tinted.
    specs:
      - label: Top
        value: Solid oak boards, edge-joined
      - label: Base
        value: Solid oak legs and frame
      - label: Seats
        value: Depends on the chosen size — we advise you during consultation
    care:
      - Wipe with a damp cloth and dry; avoid standing water and hot pans directly on the wood.
      - Re-oil once or twice a year, or whenever the surface looks dry.
      - Light marks can be sanded out locally — that is the advantage of solid wood.
    seoDescription: A handmade solid oak dining table, made to measure in Serbia and delivered to Switzerland and across Europe. Request a quote or customise the piece.
  de:
    slug: esstisch-massive-eiche
    name: Esstisch aus massiver Eiche
    summary: Ein Tisch für lange Abende und gewöhnliche Morgen — massive Eichenbretter, von Hand ausgewählt und verbunden, gemacht, um Spuren und Geschichten zu sammeln.
    story:
      - Die Bretter für jeden Tisch wählen wir gemeinsam, als Satz. Maserung, Farbe und Äste werden so angeordnet, dass die Platte als eine Fläche wirkt und jedes Brett doch seinen Charakter behält.
      - Massive Eiche lässt sich immer wieder schleifen und nachölen. Ein solcher Tisch soll nicht neu bleiben, sondern mit einem Haushalt mitwachsen.
    wood: Massive europäische Eiche.
    dimensions: Beispiel 220 × 95 × 75 cm — Länge, Breite und Höhe nach Ihrem Raum.
    finish: Hartwachsöl, natur oder leicht getönt.
    specs:
      - label: Platte
        value: Massive Eichenbretter, verleimt
      - label: Gestell
        value: Beine und Zarge aus massiver Eiche
      - label: Sitzplätze
        value: Je nach Grösse — wir beraten Sie im Gespräch
    care:
      - Mit einem feuchten Tuch abwischen und trocknen; kein stehendes Wasser und keine heissen Pfannen direkt aufs Holz.
      - Ein- bis zweimal jährlich nachölen oder wenn die Oberfläche trocken wirkt.
      - Leichte Spuren lassen sich örtlich ausschleifen — das ist der Vorteil von Massivholz.
    seoDescription: Esstisch aus massiver Eiche, in Serbien von Hand nach Mass gefertigt und in die Schweiz sowie ganz Europa geliefert. Offerte anfragen oder Stück anpassen.
  sr:
    slug: trpezarijski-sto-od-masivnog-hrasta
    name: Trpezarijski sto od masivnog hrasta
    summary: Sto za duge večeri i obična jutra — daske od masivnog hrasta, ručno birane i spajane, napravljene da skupljaju tragove i priče.
    story:
      - Daske za svaki sto biramo zajedno, kao celinu. Šaru, boju i čvorove raspoređujemo tako da ploča deluje kao jedna površina, a da svaka daska zadrži svoj karakter.
      - Masivni hrast može da se brusi i nauljuje iznova i iznova. Ovakav sto nije napravljen da ostane nov, već da raste zajedno sa domom.
    wood: Masivni evropski hrast.
    dimensions: Primer 220 × 95 × 75 cm — dužina, širina i visina prema vašem prostoru.
    finish: Tvrdo uljani vosak, prirodan ili blago toniran.
    specs:
      - label: Ploča
        value: Lepljene daske od masivnog hrasta
      - label: Postolje
        value: Noge i ram od masivnog hrasta
      - label: Broj mesta
        value: Zavisi od veličine — savetujemo vas tokom konsultacije
    care:
      - Brišite vlažnom krpom i osušite; izbegavajte vodu koja stoji i vruće posuđe direktno na drvetu.
      - Nauljite jednom ili dva puta godišnje, ili kad površina deluje suvo.
      - Sitni tragovi mogu lokalno da se izbruse — to je prednost masivnog drveta.
    seoDescription: Ručno izrađen trpezarijski sto od masivnog hrasta, po meri, iz Srbije, sa isporukom u Švajcarsku i širom Evrope. Zatražite ponudu ili prilagodite komad.
