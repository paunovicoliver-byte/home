i18n:
  en:
    slug: wooden-bench
    name: Wooden Bench
    summary: For a hallway, a dining table or the end of a bed — a simple solid wood bench made to the length you need.
    story:
      - A bench is the most modest piece of furniture we make, and one of the most used. It should be stable, comfortable and pleasant to the hand.
      - Often made to match a table, it can also stand on its own in a hallway or by a window.
    wood: Oak or walnut.
    dimensions: Example 160 × 35 × 45 cm — made to measure.
    finish: Hard-wax oil.
    specs:
      - label: Construction
        value: Solid wood seat with trestle legs
    care:
      - Wipe with a damp cloth; re-oil when needed.
    seoDescription: A handmade solid wood bench in oak or walnut, made to the length you need. Handcrafted in Serbia, delivered across Europe.
  de:
    slug: holzbank
    name: Sitzbank aus Holz
    summary: Für den Eingang, den Esstisch oder das Fussende des Betts — eine schlichte Massivholzbank in der Länge, die Sie brauchen.
    story:
      - Eine Bank ist das bescheidenste Möbel, das wir bauen, und eines der meistgenutzten. Sie soll stabil, bequem und angenehm in der Hand sein.
      - Oft passend zu einem Tisch gefertigt, steht sie genauso gut allein im Eingang oder am Fenster.
    wood: Eiche oder Nussbaum.
    dimensions: Beispiel 160 × 35 × 45 cm — nach Mass.
    finish: Hartwachsöl.
    specs:
      - label: Konstruktion
        value: Sitzfläche aus Massivholz mit Wangen
    care:
      - Mit einem feuchten Tuch abwischen; bei Bedarf nachölen.
    seoDescription: Handgefertigte Sitzbank aus massiver Eiche oder Nussbaum, in der gewünschten Länge. In Serbien gefertigt, geliefert in ganz Europa.
  sr:
    slug: drvena-klupa
    name: Drvena klupa
    summary: Za predsoblje, trpezarijski sto ili uz krevet — jednostavna klupa od masivnog drveta, u dužini koja vam treba.
    story:
      - Klupa je najskromniji komad nameštaja koji pravimo, i jedan od najkorišćenijih. Treba da bude stabilna, udobna i prijatna pod rukom.
      - Često je pravimo uz sto, ali jednako dobro stoji sama u predsoblju ili pored prozora.
    wood: Hrast ili orah.
    dimensions: Primer 160 × 35 × 45 cm — po meri.
    finish: Tvrdo uljani vosak.
    specs:
      - label: Konstrukcija
        value: Sedište od masivnog drveta sa nogarima
    care:
      - Brišite vlažnom krpom; nauljite po potrebi.
    seoDescription: Ručno izrađena klupa od masivnog hrasta ili oraha, u dužini po meri. Izrada u Srbiji, isporuka širom Evrope.
