i18n:
  en:
    slug: handmade-wooden-window
    name: Wooden Window
    summary: A solid wood window built to your opening, your architecture and the way you live — and built to be repaired rather than replaced.
    story:
      - Our wooden windows are made one at a time, for one specific opening. We start with the building — its proportions, its walls, the light it receives — and only then decide on profiles, divisions and wood.
      - Solid timber can be sanded, re-oiled, re-painted and repaired, part by part, for decades. That is the reason we have chosen wood over plastic for most of our working lives.
    wood: Oak, larch or spruce — chosen with you for the building and the exposure.
    dimensions: Made to measure for each opening.
    finish: Natural oil, oil-based wax or opaque paint, agreed per project.
    specs:
      - label: Construction
        value: Solid timber frame with traditional corner joints
      - label: Opening types
        value: Casement, tilt-and-turn, fixed — depending on the project
      - label: Glazing
        value: Specified per project, from single panes to insulated glazing units where appropriate
      - label: Hardware
        value: Selected per project and building
    care:
      - Wipe frames with a soft, damp cloth; avoid harsh cleaning agents.
      - Check the finish once a year, especially on the weather side and the bottom rail.
      - Refresh oil or paint as soon as the surface looks dry or worn — small, regular care is easier than large repairs.
    seoTitle: Wooden Window — solid timber, made for one opening
    seoDescription: Solid wood windows handmade in Serbia for houses in Switzerland and across Europe. Made to measure, repairable and built around your architecture.
  de:
    slug: holzfenster-nach-mass
    name: Holzfenster
    summary: Ein Fenster aus Massivholz, gebaut für Ihre Öffnung, Ihre Architektur und Ihren Alltag — und so gebaut, dass man es reparieren statt ersetzen kann.
    story:
      - Unsere Holzfenster entstehen einzeln, für eine bestimmte Öffnung. Wir beginnen beim Gebäude — bei seinen Proportionen, seinen Mauern, seinem Licht — und entscheiden erst dann über Profile, Teilung und Holz.
      - Massivholz lässt sich schleifen, nachölen, neu streichen und Teil für Teil reparieren, über Jahrzehnte. Deshalb haben wir uns fast unser ganzes Berufsleben lang für Holz und gegen Kunststoff entschieden.
    wood: Eiche, Lärche oder Fichte — gemeinsam gewählt, passend zu Gebäude und Lage.
    dimensions: Für jede Öffnung nach Mass gefertigt.
    finish: Naturöl, Ölwachs oder deckende Farbe, je nach Projekt.
    specs:
      - label: Konstruktion
        value: Rahmen aus Massivholz mit traditionellen Eckverbindungen
      - label: Öffnungsarten
        value: Drehflügel, Dreh-Kipp, Festverglasung — je nach Projekt
      - label: Verglasung
        value: Projektbezogen festgelegt, von Einfachglas bis Isolierglas, wo es sinnvoll ist
      - label: Beschläge
        value: Je nach Projekt und Gebäude ausgewählt
    care:
      - Rahmen mit einem weichen, feuchten Tuch reinigen; keine scharfen Reinigungsmittel verwenden.
      - Die Oberfläche einmal jährlich prüfen, besonders auf der Wetterseite und am unteren Rahmenholz.
      - Öl oder Farbe auffrischen, sobald die Oberfläche trocken oder abgenutzt wirkt — regelmässige kleine Pflege ist einfacher als grosse Reparaturen.
    seoTitle: Holzfenster — Massivholz, für eine Öffnung gebaut
    seoDescription: Massivholzfenster, in Serbien von Hand gefertigt, für Häuser in der Schweiz und in ganz Europa. Nach Mass, reparierbar und auf Ihre Architektur abgestimmt.
  sr:
    slug: drveni-prozor-po-meri
    name: Drveni prozor
    summary: Prozor od masivnog drveta, napravljen za vaš otvor, vašu arhitekturu i vaš način života — i napravljen tako da se popravlja, a ne menja.
    story:
      - Naše drvene prozore pravimo jedan po jedan, za tačno određeni otvor. Počinjemo od zgrade — od njenih proporcija, zidova i svetla — i tek onda biramo profile, podelu i vrstu drveta.
      - Masivno drvo može da se brusi, ponovo nauljuje, farba i popravlja deo po deo, decenijama. Zato smo gotovo ceo radni vek birali drvo umesto plastike.
    wood: Hrast, ariš ili smrča — biramo zajedno, prema objektu i izloženosti.
    dimensions: Izrada po meri za svaki otvor.
    finish: Prirodno ulje, uljani vosak ili pokrivna boja, prema dogovoru.
    specs:
      - label: Konstrukcija
        value: Okvir od masivnog drveta sa tradicionalnim ugaonim spojevima
      - label: Način otvaranja
        value: Krilno, okretno-nagibno, fiksno — u zavisnosti od projekta
      - label: Zastakljivanje
        value: Određuje se za svaki projekat, od jednostrukog stakla do termoizolacionog, gde je to opravdano
      - label: Okov
        value: Bira se prema projektu i objektu
    care:
      - Okvire brišite mekom, vlažnom krpom; izbegavajte agresivna sredstva za čišćenje.
      - Jednom godišnje proverite površinu, naročito na strani izloženoj vremenu i na donjem delu okvira.
      - Osvežite ulje ili boju čim površina deluje suvo ili istrošeno — redovna sitna nega lakša je od velikih popravki.
    seoTitle: Drveni prozor — masivno drvo, za jedan otvor
    seoDescription: Prozori od masivnog drveta, ručno izrađeni u Srbiji, za domove u Švajcarskoj i širom Evrope. Po meri, popravljivi i usklađeni sa vašom arhitekturom.
