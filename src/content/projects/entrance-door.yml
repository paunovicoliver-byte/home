i18n:
  en:
    slug: panelled-entrance-door
    title: A panelled entrance door
    summary: A new entrance door in solid wood, drawn to the proportions of an existing house.
    type: Door · House
    story:
      - The old door had been replaced decades ago with something that never quite fitted. The owners wanted a door that belonged to the house again.
      - We drew the panels from the proportions of the façade and the windows, and built the door in solid wood.
    challenge:
      - Finding a design that felt original to the house without copying a door that no longer existed.
    approach:
      - Proportions taken from the façade; a panelled construction in solid wood; finish agreed with the owners.
    materials:
      - Solid wood
      - Oil finish
    seoDescription: A custom panelled entrance door in solid wood, designed from the proportions of the house and made by hand.
  de:
    slug: kassetten-haustuer
    title: Eine Kassetten-Haustür
    summary: Eine neue Haustür aus Massivholz, gezeichnet nach den Proportionen eines bestehenden Hauses.
    type: Tür · Wohnhaus
    story:
      - Die alte Tür war vor Jahrzehnten durch etwas ersetzt worden, das nie richtig passte. Die Besitzer wünschten sich wieder eine Tür, die zum Haus gehört.
      - Wir haben die Kassetten aus den Proportionen von Fassade und Fenstern entwickelt und die Tür in Massivholz gebaut.
    challenge:
      - Einen Entwurf zu finden, der zum Haus gehört, ohne eine Tür zu kopieren, die es nicht mehr gibt.
    approach:
      - Proportionen von der Fassade abgeleitet; Kassettenkonstruktion in Massivholz; Oberfläche mit den Besitzern abgestimmt.
    materials:
      - Massivholz
      - Öloberfläche
    seoDescription: Kassetten-Haustür aus Massivholz nach Mass, aus den Proportionen des Hauses entwickelt und von Hand gebaut.
  sr:
    slug: ulazna-vrata-sa-kasetama
    title: Ulazna vrata sa kasetama
    summary: Nova ulazna vrata od masivnog drveta, nacrtana prema proporcijama postojeće kuće.
    type: Vrata · Kuća
    story:
      - Stara vrata su pre nekoliko decenija zamenjena nečim što nikada nije sasvim pristajalo. Vlasnici su želeli vrata koja ponovo pripadaju kući.
      - Kasete smo izveli iz proporcija fasade i prozora, a vrata izradili od masivnog drveta.
    challenge:
      - Pronaći oblik koji deluje izvorno za kuću, bez kopiranja vrata koja više ne postoje.
    approach:
      - Proporcije preuzete sa fasade; konstrukcija sa kasetama od masivnog drveta; završna obrada dogovorena sa vlasnicima.
    materials:
      - Masivno drvo
      - Završna obrada uljem
    seoDescription: Ulazna vrata sa kasetama od masivnog drveta po meri, osmišljena prema proporcijama kuće i ručno izrađena.
