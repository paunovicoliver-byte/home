i18n:
  en:
    slug: oak-table-for-a-family-home
    title: An oak table for a family home
    summary: A long dining table, sized to the room and to the family around it.
    type: Table · Custom
    story:
      - It began with a photograph of an empty dining room and a rough measurement. Nothing more was needed to start the conversation.
      - Together we settled the length, the height and the feel of the edges. The boards were chosen as a set, so the top reads as one surface.
    challenge:
      - A room with a low window sill and a wish for a table that seats many without feeling heavy.
    approach:
      - Proportions drawn for the room, legs set back for comfortable seating, a light hard-wax oil finish.
    materials:
      - Solid oak
      - Hard-wax oil
    seoDescription: A custom solid oak dining table, made by hand for a family home — sized to the room and to the people around it.
  de:
    slug: eichentisch-fuer-ein-familienhaus
    title: Ein Eichentisch für ein Familienhaus
    summary: Ein langer Esstisch, abgestimmt auf den Raum und auf die Familie, die daran sitzt.
    type: Tisch · Nach Mass
    story:
      - Am Anfang standen ein Foto eines leeren Esszimmers und ein ungefähres Mass. Mehr brauchte es nicht, um das Gespräch zu beginnen.
      - Gemeinsam haben wir Länge, Höhe und das Gefühl der Kanten festgelegt. Die Bretter wurden als Satz ausgewählt, sodass die Platte als eine Fläche wirkt.
    challenge:
      - Ein Raum mit niedriger Fensterbrüstung und der Wunsch nach einem Tisch, an dem viele Platz finden, ohne dass er schwer wirkt.
    approach:
      - Proportionen für den Raum gezeichnet, Beine zurückversetzt für bequemes Sitzen, eine helle Hartwachsöl-Oberfläche.
    materials:
      - Massive Eiche
      - Hartwachsöl
    seoDescription: Esstisch aus massiver Eiche nach Mass, von Hand für ein Familienhaus gefertigt — abgestimmt auf den Raum und die Menschen daran.
  sr:
    slug: hrastov-sto-za-porodicni-dom
    title: Hrastov sto za porodični dom
    summary: Dugačak trpezarijski sto, prilagođen prostoru i porodici koja sedi za njim.
    type: Sto · Po meri
    story:
      - Sve je počelo fotografijom prazne trpezarije i okvirnom merom. Ništa više nije bilo potrebno da započnemo razgovor.
      - Zajedno smo dogovorili dužinu, visinu i osećaj ivica. Daske smo birali kao celinu, kako bi ploča delovala kao jedna površina.
    challenge:
      - Prostorija sa niskim parapetom prozora i želja za stolom za koji može da sedne mnogo ljudi, a da ne deluje teško.
    approach:
      - Proporcije nacrtane za prostor, noge uvučene radi udobnog sedenja, svetla završna obrada tvrdo uljanim voskom.
    materials:
      - Masivni hrast
      - Tvrdo uljani vosak
    seoDescription: Trpezarijski sto od masivnog hrasta po meri, ručno izrađen za porodični dom — prilagođen prostoru i ljudima za njim.
