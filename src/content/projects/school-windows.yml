i18n:
  en:
    slug: old-school-windows
    title: Restoring the windows of an old school
    summary: Tall classroom windows, repaired and renewed so that a school building could keep its rhythm and its light.
    type: Restoration · Public building
    story:
      - Old schools were built around daylight. Their tall windows give the façade its rhythm and the classrooms their calm.
      - Our work was to keep as much of the original as possible, and to renew what could no longer serve.
    challenge:
      - Many windows of the same type, each in a slightly different condition — and a building that needed to stay in use.
    approach:
      - We assessed each window individually and grouped the work so that disruption stayed small.
      - Profiles were recorded once and reproduced consistently, so repaired and new elements read as one façade.
    materials:
      - Solid timber
      - Traditional profiles and joinery
    seoDescription: Repair and renewal of tall wooden classroom windows in an old school building, keeping the façade's rhythm and character.
  de:
    slug: fenster-altes-schulhaus
    title: Die Fenster eines alten Schulhauses
    summary: Hohe Schulzimmerfenster, repariert und erneuert, damit ein Schulhaus seinen Rhythmus und sein Licht behält.
    type: Restaurierung · Öffentlicher Bau
    story:
      - Alte Schulhäuser wurden um das Tageslicht herum gebaut. Ihre hohen Fenster geben der Fassade den Rhythmus und den Schulzimmern ihre Ruhe.
      - Unsere Aufgabe war es, so viel wie möglich vom Original zu erhalten und zu erneuern, was nicht mehr dienen konnte.
    challenge:
      - Viele Fenster desselben Typs, jedes in einem etwas anderen Zustand — und ein Gebäude, das in Betrieb bleiben musste.
    approach:
      - Wir haben jedes Fenster einzeln beurteilt und die Arbeiten so gebündelt, dass die Störung gering blieb.
      - Die Profile wurden einmal aufgenommen und durchgehend gleich nachgebaut, sodass reparierte und neue Elemente als eine Fassade wirken.
    materials:
      - Massivholz
      - Traditionelle Profile und Verbindungen
    seoDescription: Reparatur und Erneuerung hoher Holzfenster in einem alten Schulhaus — Rhythmus und Charakter der Fassade bleiben erhalten.
  sr:
    slug: prozori-stare-skole
    title: Obnova prozora stare škole
    summary: Visoki prozori učionica, popravljeni i obnovljeni kako bi školska zgrada sačuvala svoj ritam i svoje svetlo.
    type: Restauracija · Javni objekat
    story:
      - Stare škole građene su oko dnevnog svetla. Njihovi visoki prozori daju fasadi ritam, a učionicama mir.
      - Naš zadatak bio je da sačuvamo što više originala i da obnovimo ono što više nije moglo da služi.
    challenge:
      - Mnogo prozora istog tipa, svaki u ponešto drugačijem stanju — i zgrada koja je morala da ostane u upotrebi.
    approach:
      - Svaki prozor smo procenili pojedinačno i rasporedili radove tako da ometanje bude što manje.
      - Profile smo snimili jednom i dosledno ih ponavljali, tako da popravljeni i novi elementi deluju kao jedna fasada.
    materials:
      - Masivno drvo
      - Tradicionalni profili i spojevi
    seoDescription: Popravka i obnova visokih drvenih prozora stare škole, uz očuvanje ritma i karaktera fasade.
