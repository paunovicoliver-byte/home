i18n:
  en:
    slug: old-family-house
    title: An old house, kept alive
    summary: Windows and an entrance door for a traditional family house — repaired where possible, rebuilt where necessary.
    type: Restoration · House
    story:
      - The owners wanted to live in the house, not in a museum. But they also did not want to lose what made it theirs.
      - So we kept the original windows wherever the wood allowed, rebuilt the rest in the same language, and made a new entrance door to match.
    challenge:
      - Windows of different ages and conditions, and a wish for more comfort without changing the face of the house.
    approach:
      - Repair first, reproduction second — every decision explained and agreed with the family.
    materials:
      - Oak and larch
      - Oil and paint finishes
    seoDescription: Restoration of the wooden windows and entrance door of a traditional family house — repaired where possible, rebuilt by hand where necessary.
  de:
    slug: altes-familienhaus
    title: Ein altes Haus, lebendig erhalten
    summary: Fenster und eine Haustür für ein traditionelles Familienhaus — repariert, wo möglich, neu gebaut, wo nötig.
    type: Restaurierung · Wohnhaus
    story:
      - Die Besitzer wollten im Haus leben, nicht in einem Museum. Aber sie wollten auch nicht verlieren, was es zu ihrem Haus machte.
      - Also haben wir die Originalfenster erhalten, wo das Holz es zuliess, den Rest in derselben Sprache neu gebaut und eine passende Haustür gefertigt.
    challenge:
      - Fenster unterschiedlichen Alters und Zustands — und der Wunsch nach mehr Komfort, ohne das Gesicht des Hauses zu verändern.
    approach:
      - Zuerst reparieren, dann nachbauen — jeder Entscheid mit der Familie besprochen und abgestimmt.
    materials:
      - Eiche und Lärche
      - Öl- und Farboberflächen
    seoDescription: Restaurierung der Holzfenster und der Haustür eines traditionellen Familienhauses — repariert, wo möglich, von Hand neu gebaut, wo nötig.
  sr:
    slug: stara-porodicna-kuca
    title: Stara kuća, sačuvana u životu
    summary: Prozori i ulazna vrata za tradicionalnu porodičnu kuću — popravljeni gde je moguće, ponovo izrađeni gde je potrebno.
    type: Restauracija · Kuća
    story:
      - Vlasnici su želeli da žive u kući, a ne u muzeju. Ali nisu želeli ni da izgube ono što je činilo njihovom.
      - Zato smo sačuvali originalne prozore gde god je drvo dozvoljavalo, ostale smo napravili istim jezikom, a izradili smo i nova ulazna vrata u istom duhu.
    challenge:
      - Prozori različite starosti i stanja, i želja za više udobnosti bez menjanja lica kuće.
    approach:
      - Prvo popravka, pa tek onda rekonstrukcija — svaka odluka objašnjena i dogovorena sa porodicom.
    materials:
      - Hrast i ariš
      - Završna obrada uljem i bojom
    seoDescription: Restauracija drvenih prozora i ulaznih vrata tradicionalne porodične kuće — popravljeno gde je moguće, ručno izrađeno iznova gde je potrebno.
